[project]
name = "google-auth-pc"
version = "0.1.0"
description = "Windows icin cevrimdisi TOTP kod ureticisi (Google Authenticator aktarimli)"
requires-python = ">=3.12"
dependencies = [
  "customtkinter>=5.2",
  "pyotp>=2.9",
  "pystray>=0.19",
  "Pillow>=10",
  "zxing-cpp>=3",
  "winrt-runtime>=3.2.1",
  "winrt-Windows.Foundation>=3.2.1",
  "winrt-Windows.Security.Credentials.UI>=3.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "segno>=1.6", "pyinstaller>=6"]

[project.scripts]
google-auth-pc = "google_auth_pc.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
